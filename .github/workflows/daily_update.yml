name: Daily Stock Data Update

on:
  schedule:
    # 設定每天台灣時間 16:00 執行 (UTC 08:00)，僅週一至週五
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # 保留一個按鈕讓你可以隨時手動點擊執行

jobs:
  run-script-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      # 確保安裝 pandas 讀取 HTML 表格所需的 lxml 引擎
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas requests lxml

    - name: Run Python script
      # 請確保檔名與你實際上傳的檔名完全一致
      run: python 台股創新高比例_每日計算_對比大盤_1.py

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add 台股創新高比例_歷史資料.csv 台股創新高比例_圖表.html
        git commit -m "Auto update daily data" || echo "No changes to commit"
        git push
